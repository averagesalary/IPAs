<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Install Center</title>
<style>
  :root {
    --bg: #0b0f17;
    --card: #141b26;
    --card-hover: #1b2433;
    --accent: #3b82f6;
    --accent-2: #60a5fa;
    --text: #e6edf6;
    --muted: #8b95a7;
    --border: #1f2937;
    --success: #22c55e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 20% 0%, rgba(59,130,246,0.15), transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(96,165,250,0.10), transparent 40%),
      var(--bg);
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 420px;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo {
    width: 68px;
    height: 68px;
    margin: 0 auto 16px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(59,130,246,0.35);
  }

  .logo svg { width: 34px; height: 34px; fill: white; }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
    transition: all 0.2s ease;
    display: block;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(59,130,246,0.08), transparent);
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .card:hover, .card:active {
    background: var(--card-hover);
    border-color: rgba(59,130,246,0.4);
    transform: translateY(-1px);
  }

  .card:hover::before { opacity: 1; }

  .card-content {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 1;
  }

  .icon {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(59,130,246,0.12);
    border: 1px solid rgba(59,130,246,0.25);
  }

  .icon svg { width: 22px; height: 22px; fill: var(--accent-2); }

  .icon.green {
    background: rgba(34,197,94,0.12);
    border-color: rgba(34,197,94,0.25);
  }
  .icon.green svg { fill: var(--success); }

  .text { flex: 1; min-width: 0; }

  .title {
    font-size: 15.5px;
    font-weight: 600;
    margin-bottom: 3px;
    letter-spacing: -0.2px;
  }

  .desc {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.4;
  }

  .arrow {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    fill: var(--muted);
    transition: transform 0.2s ease, fill 0.2s ease;
  }

  .card:hover .arrow {
    transform: translateX(3px);
    fill: var(--accent-2);
  }

  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.6;
  }

  .footer .dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--muted);
    margin: 0 6px;
    vertical-align: middle;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--success);
    margin-top: 8px;
    padding: 3px 9px;
    background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.2);
    border-radius: 20px;
  }

  .status::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  @media (max-width: 380px) {
    .icon { width: 40px; height: 40px; }
    .icon svg { width: 20px; height: 20px; }
    .title { font-size: 14.5px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V6l-8-4zm0 4.5c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 12.5c-2.5 0-4.71-1.28-6-3.23.03-1.99 4-3.07 6-3.07s5.97 1.08 6 3.07c-1.29 1.95-3.5 3.23-6 3.23z"/></svg>
      </div>
      <h1>Install Center</h1>
      <p class="subtitle">Install the DNS profile first, then the app.</p>
      <div class="status">Servers Online</div>
    </div>

    <!-- DNS Profile -->
    <a class="card" href="https://github.com/averagesalary/IPAs/releases/download/r0/khoindvn.mobileconfig">
      <div class="card-content">
        <div class="icon green">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>
        <div class="text">
          <div class="title">Install DNS Profile</div>
          <div class="desc">Required for the app to work properly</div>
        </div>
        <svg class="arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      </div>
    </a>

    <!-- App IPA -->
    <a class="card" href="itms-services://?action=download-manifest&url=https://github.com/averagesalary/IPAs/releases/download/r0/khoindvn.mobileconfigmanifest.plist">
      <div class="card-content">
        <div class="icon">
          <svg viewBox="0 0 24 24"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24c-1.42-.65-3.05-1.02-4.77-1.02s-3.35.37-4.77 1.02L4.65 5.67c-.18-.28-.54-.37-.83-.22-.3.16-.42.54-.26.85L5.4 9.48C2.98 10.79 1.3 13.14 1 15.94h22c-.3-2.8-1.98-5.15-4.4-6.46zM7.5 14c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm9 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
        </div>
        <div class="text">
          <div class="title">Install App</div>
          <div class="desc">Tap to install the signed IPA</div>
        </div>
        <svg class="arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      </div>
    </a>

    <div class="footer">
      Open this page in <strong>Safari</strong> on your iPhone or iPad<br />
      <span class="dot"></span>Trust the profile in Settings after install<span class="dot"></span>
    </div>
  </div>
</body>
</html>
